appId: host.exp.Exponent
---
# A failed suite must not leave a native sheet over the next suite's screen.
# Restarting Expo Go also resets this demo's in-memory accounts and mutations.
- stopApp
- openLink: 'exp://localhost:8093/--/?__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1'
- extendedWaitUntil:
    visible: '(Open|Any time|Continue)'
    timeout: 120000
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn:
          text: Open
          retryTapIfNoChange: true
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- extendedWaitUntil:
    visible: Any time
    timeout: 120000
