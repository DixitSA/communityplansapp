appId: host.exp.Exponent
---
- runFlow: reset-demo.yml
- openLink: 'exp://localhost:8093/--/event/ev-007'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Rooftop Happy Hour
    timeout: 30000

# Clear an Interested plan, then restore it through the in-app undo toast.
- tapOn: Interested
- assertVisible: Only you can see this
- tapOn: Interested
- tapOn:
    text: Undo
    waitToSettleTimeoutMs: 0
- assertVisible:
    text: Interested
    selected: true
- assertVisible: Only you can see this
