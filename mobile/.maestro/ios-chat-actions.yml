appId: host.exp.Exponent
---
- runFlow: reset-demo.yml
- openLink: 'exp://localhost:8093/--/event/ev-007'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Rooftop Happy Hour
    timeout: 30000
- tapOn: Going
- assertVisible: You're going
- tapOn: Open chat
- extendedWaitUntil:
    visible: Chat options
    timeout: 30000
- tapOn: 'Message( Message the group)?'
- inputText: 'QA-CHAT-ACTIONS-20261105-01'
- tapOn: Send message
- extendedWaitUntil:
    visible: '.*QA-CHAT-ACTIONS-20261105-01.*'
    timeout: 30000

# Cancel the message menu, then the confirmation, before confirming a demo-only deletion.
- longPressOn: '.*QA-CHAT-ACTIONS-20261105-01.*'
- assertVisible: Delete message
- assertVisible: Cancel
- tapOn: Cancel
- assertVisible: '.*QA-CHAT-ACTIONS-20261105-01.*'
- longPressOn: '.*QA-CHAT-ACTIONS-20261105-01.*'
- tapOn: Delete message
- assertVisible: 'Delete this message\?'
- assertVisible: Cancel
- tapOn: Cancel
- assertVisible: '.*QA-CHAT-ACTIONS-20261105-01.*'
- longPressOn: '.*QA-CHAT-ACTIONS-20261105-01.*'
- tapOn: Delete message
- assertVisible: 'Delete this message\?'
- tapOn: Delete
- extendedWaitUntil:
    visible: 'You, .*: Message deleted'
    timeout: 30000
- assertNotVisible: '.*QA-CHAT-ACTIONS-20261105-01.*'

# Cancel leaving, then confirm leaving; reopening the direct chat link verifies the membership gate.
- tapOn: Chat options
- assertVisible: Leave chat
- tapOn: Leave chat
- assertVisible: 'leave this chat\?'
- assertVisible: 'you’ll stop Going and leave the chat. it stays saved as Interested.'
- tapOn: Cancel
- assertVisible: Chat options
- tapOn: Chat options
- tapOn: Leave chat
- assertVisible: 'leave this chat\?'
- tapOn: Leave chat
- extendedWaitUntil:
    visible: Rooftop Happy Hour
    timeout: 30000
- openLink: 'exp://localhost:8093/--/chat/ev-007'
- extendedWaitUntil:
    visible: 'tap Going to join the chat'
    timeout: 30000
- assertVisible: 'Only people who are going can read and send messages.'
- assertVisible: Going
- takeScreenshot: native-chat-membership-recovery
