appId: host.exp.Exponent
---
- runFlow: reset-demo.yml
- openLink: 'exp://localhost:8093/--/event/ev-007'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Rooftop Happy Hour
    timeout: 30000

# Clear an Interested plan, then restore it through the in-app undo toast.
- tapOn: Interested
- assertVisible: Only you can see this
- tapOn: Interested
- tapOn:
    text: Undo
    waitToSettleTimeoutMs: 0
- assertVisible:
    text: Interested
    selected: true
- assertVisible: Only you can see this

# iOS 26's compact share sheet has no Close button; dismiss its observed header with a swipe.
- tapOn: Share Rooftop Happy Hour
- assertVisible: Copy
- assertVisible: Save to Files
- takeScreenshot: native-event-share-open
- swipe:
    start: 50%, 60%
    end: 50%, 95%
    duration: 500
- assertNotVisible: Copy
- assertVisible: Rooftop Happy Hour

- tapOn: Going
- assertVisible: You're going
- scrollUntilVisible:
    element: Bring a friend
    direction: DOWN
- tapOn: Bring a friend
- assertVisible: Copy
- assertVisible: Save to Files
- swipe:
    start: 50%, 60%
    end: 50%, 95%
    duration: 500
- assertNotVisible: Copy
- assertVisible: You're going
- scrollUntilVisible:
    element: Add to Calendar
    direction: UP
- tapOn: Add to Calendar
- assertVisible: New Event
- assertVisible: Cancel
- tapOn: Cancel
- assertVisible: You're going
- takeScreenshot: native-event-actions-cancelled
