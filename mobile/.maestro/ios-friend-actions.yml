appId: host.exp.Exponent
---
# Deterministic friend relationship actions against reset in-memory demo fixtures.
- runFlow: reset-demo.yml
- openLink: 'exp://localhost:8093/--/friends'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Friends
    timeout: 30000

# Decline Noah's seeded incoming request.
- scrollUntilVisible:
    element: "Decline Noah Kim's friend request"
    direction: DOWN
- assertVisible: "Decline Noah Kim's friend request"
- tapOn: "Decline Noah Kim's friend request"
- assertNotVisible: "Decline Noah Kim's friend request"
- takeScreenshot: friends-request-declined

# Send Ana Reyes a request, keep it once, then cancel it.
- openLink: 'exp://localhost:8093/--/search'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: discovery-search-input
    timeout: 30000
- tapOn: People
- tapOn:
    id: discovery-search-input
- inputText: Ana
- extendedWaitUntil:
    visible: 'Ana Reyes, @ana.reyes'
    timeout: 30000
- assertVisible: Add Ana Reyes as a friend
- tapOn: Add Ana Reyes as a friend
- assertVisible: Friend request to Ana Reyes sent
- takeScreenshot: friends-request-sent
- tapOn: Friend request to Ana Reyes sent
- assertVisible: 'Cancel your request to Ana Reyes\?'
- assertVisible: Keep request
- assertVisible: Cancel request
- tapOn: Keep request
- assertVisible: Friend request to Ana Reyes sent
- tapOn: Friend request to Ana Reyes sent
- assertVisible: 'Cancel your request to Ana Reyes\?'
- tapOn: Cancel request
- extendedWaitUntil:
    visible: Add Ana Reyes as a friend
    timeout: 30000

# Remove Maya Chen, verify cancellation preserves the friendship, then confirm removal.
- openLink: 'exp://localhost:8093/--/friends'
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: 'Maya Chen, @maya.chen'
    direction: DOWN
- tapOn: 'Maya Chen, @maya.chen'
- extendedWaitUntil:
    visible: 'Friends with Maya Chen'
    timeout: 30000
- tapOn: 'Friends with Maya Chen'
- assertVisible: Remove friend
- tapOn: Remove friend
- assertVisible: 'Remove Maya Chen as a friend\?'
- assertVisible: Cancel
- assertVisible: Remove
- tapOn: Cancel
- assertVisible: 'Friends with Maya Chen'
- tapOn: 'Friends with Maya Chen'
- assertVisible: Remove friend
- tapOn: Remove friend
- assertVisible: 'Remove Maya Chen as a friend\?'
- tapOn: Remove
- extendedWaitUntil:
    visible: Add Maya Chen as a friend
    timeout: 30000
- takeScreenshot: friends-removal-confirmed
