appId: host.exp.Exponent
---
# City picker selection/dismissal is already covered by ios-map-permission.yml.
# Exercise the uncovered feed-card Link.Menu without selecting an action.
- runFlow: reset-demo.yml
- assertVisible: Nearby
- scrollUntilVisible:
    element:
      id: event-row-ev-006
    direction: DOWN
- longPressOn:
    id: event-row-ev-006
- assertVisible: Going
- assertVisible: Share
- assertVisible: Directions
- takeScreenshot: native-event-card-menu-open
# The static wordmark is outside the preview and has no action; tapping it dismisses the menu.
- tapOn: yard.
- assertNotVisible: Directions
- assertVisible: Nearby
- assertVisible:
    id: event-row-ev-006
- takeScreenshot: native-event-card-menu-dismissed
