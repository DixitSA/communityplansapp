name: iOS demo QA

on:
  push:
    branches: ['qa/ios-sweep-*']
    paths: ['mobile/**', '.github/workflows/ios-qa.yml']
  workflow_dispatch:
    inputs:
      group:
        description: 'Run all groups or one focused native check'
        type: choice
        default: all
        options: [all, layout, menus, social, onboarding, idb, navigation, event-actions]

permissions:
  contents: read

concurrency:
  group: ios-qa-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.group || 'all' }}
  cancel-in-progress: false

jobs:
  simulator:
    # Standard runner: free for this public repository. Do not use -large/-xlarge.
    runs-on: ${{ matrix.group == 'idb' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.group != 'all' && format('["{0}"]', inputs.group) || '["layout","menus","social","onboarding","idb","navigation"]') }}
    name: iOS demo QA (${{ matrix.group }})
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''
      # The first ARM runner exceeded the iOS driver's 120-second startup window.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      QA_FLOWS: ${{ matrix.group == 'layout' && 'ios-profile-settings ios-discovery ios-smoke' || matrix.group == 'menus' && 'ios-core-flows ios-chat-actions ios-event-actions' || matrix.group == 'social' && 'ios-native-menus ios-friend-actions ios-privacy-resume' || matrix.group == 'onboarding' && 'ios-onboarding ios-activity-suggest ios-map-permission' || matrix.group == 'navigation' && 'ios-navigation-menus' || matrix.group == 'event-actions' && 'ios-event-actions' || '' }}
      QA_ENGINE: ${{ matrix.group == 'idb' && 'idb' || 'maestro' }}
    steps:
      - uses: actions/checkout@v4
      - name: Quarantine checkout dotenv files
        run: |
          expected="$GITHUB_WORKSPACE/mobile"
          actual="$(pwd -P)"
          expected_real="$(cd "$expected" && pwd -P)"
          test "$actual" = "$expected_real"
          quarantine="$RUNNER_TEMP/yard-qa-dotenv"
          mkdir -p "$quarantine"
          chmod 700 "$quarantine"
          moved=0
          for file in .env .env.*; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              name="${file##*/}"
              mv "$file" "$quarantine/$name"
              printf 'Quarantined %s\n' "$name"
              moved=1
            fi
          done
          if [[ "$moved" -eq 0 ]]; then
            echo 'No regular dotenv files found in the QA checkout.'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app dependencies
        run: npm ci
      - name: Install pinned Maestro CLI
        if: matrix.group != 'idb'
        run: |
          archive="$RUNNER_TEMP/yard-maestro.zip"
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip --output "$archive"
          printf '%s  %s\n' 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7 "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/yard-maestro"
          maestro_bin="$(find "$RUNNER_TEMP/yard-maestro" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          dirname "$maestro_bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
      - name: Install pinned idb toolset
        if: matrix.group == 'idb'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap meta/fb
          tap_dir="$(brew --repo meta/fb)"
          git -C "$tap_dir" fetch --depth 1 origin f2c725e984cfaa8e2c648be069f3d63925776c83
          git -C "$tap_dir" checkout --detach f2c725e984cfaa8e2c648be069f3d63925776c83
          brew trust meta/fb
          brew install meta/fb/idb
          brew list --versions meta/fb/idb meta/fb/idb-cli meta/fb/idb-companion
      - name: Run Expo Go on iOS Simulator
        run: |
          perl -e '$limit=shift; $child=fork(); die "fork failed" unless defined $child; if (!$child) { setpgrp(0,0); exec @ARGV; exit 127 } $SIG{ALRM}=sub { kill "TERM", -$child; sleep 1; kill "KILL", -$child; exit 124 }; alarm $limit; waitpid($child,0); exit(($? & 127) ? 128 + ($? & 127) : $? >> 8)' \
            2700 bash .eas/scripts/ios-expo-go-smoke.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .maestro/results
          if [ -d "$HOME/.maestro/tests" ]; then cp -R "$HOME/.maestro/tests/." .maestro/results/; fi
          if [ -f /tmp/yard-metro.log ]; then cp /tmp/yard-metro.log .maestro/results/metro.log; fi
          if xcrun simctl list devices booted | grep -q '(Booted)'; then
            xcrun simctl io booted screenshot .maestro/results/diagnostics-last-screen.png || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-demo-qa-${{ matrix.group }}
          path: mobile/.maestro/results
          retention-days: 1
